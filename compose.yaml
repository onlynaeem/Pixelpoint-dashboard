services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: pixelpoint
      POSTGRES_USER: pixelpoint
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pixelpoint"]
      interval: 5s
      retries: 20
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://pixelpoint:${POSTGRES_PASSWORD}@db:5432/pixelpoint
      CLOUD_CONFIG: /app/config/cloud.json
      HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./config:/app/config:ro
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:

